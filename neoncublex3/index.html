</script><script id="code" type="text/x-microscript">


function()
randRange = function(low, high)
  return (high - low) * random.next() + low
end

distance = function(x1, y1, x2, y2)
  local dx = x2 - x1
  local dy = y2 - y1
  return sqrt(pow(dx, 2) + pow(dy, 2))
end

breakgame = function()
  gameon = false
end

createEnemy = function(x, y, dx, dy)
  return object
    x = x
    y = y
    dx = dx
    dy = dy
    speed = 2
  end
end

resetEnemy = function(e)
  if e.dy != 0 then
    if e.dy > 0 then
      e.y = -100
    else
      e.y = 100
    end
    e.x = randRange(-195, 195)
  else
    if e.dx > 0 then
      e.x = -195
    else
      e.x = 195
    end
    e.y = randRange(-100, 100)
  end
end


init = function()
  gameon = true
  points = 0
  player = object x = 0 y = 0 end

  enemies = [
    createEnemy(randRange(-195, 195), 100, 0, -1),
    createEnemy(randRange(-195, 195), -100, 0, 1),
    createEnemy(-195, randRange(-100, 100), 1, 0),
    createEnemy(195, randRange(-100, 100), -1, 0)
  ]

  coin = object
    x = randRange(-190, 190)
    y = randRange(-90, 90)
    width = 10
    height = 10
    color = "rgb(255,255,0)"
  end
end

update = function()
  if not gameon then return end

  local speed = 2
  if keyboard.LEFT and player.x > -190 then player.x -= speed end
  if keyboard.RIGHT and player.x < 190 then player.x += speed end
  if keyboard.UP and player.y < 90 then player.y += speed end
  if keyboard.DOWN and player.y > -90 then player.y -= speed end

  for e in enemies
    e.x += e.dx * (e.speed + points)
    e.y += e.dy * (e.speed + points)
    if abs(e.x) > 195 or abs(e.y) > 100 then resetEnemy(e) end
    if distance(player.x, player.y, e.x, e.y) < 10 then
      audio.beep("square tempo 960 volumen 12 span 50 C6 F5 C5 end")
      breakgame()
    end
  end

  if distance(player.x, player.y, coin.x, coin.y) < 10 then
    audio.beep("square tempo 960 volumen 12 span 50 F5 C6")
    coin.x = randRange(-190, 190)
    coin.y = randRange(-90, 90)
    points += 1
  end
end

draw = function()
  screen.clear()
  screen.drawRect(player.x, player.y, 10, 10, "rgb(0,85,255)")
  for e in enemies
    screen.drawRect(e.x, e.y, 10, 10, "rgb(255,0,0)")
  end
  screen.drawRect(coin.x, coin.y, coin.width, coin.height, coin.color)
  screen.drawText("Points: " + points, -50, 50, 10, "rgb(255,255,255)")

  if not gameon then
    screen.drawText("Try harder, loser", 0, 0, 25, "rgb(255,255,255)")
    screen.drawText("Press space to try again!", 0, -30, 10,"rgb(141,141,141)")
    if keyboard.SPACE then init() end
  end
end

end()
